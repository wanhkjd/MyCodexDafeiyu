<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'">
<title>白饭 · 拖到桌宠身上</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;user-select:none}
button{display:block;width:100%;height:100%;border:0;padding:5%;background:transparent;cursor:grab;touch-action:none}
button img{width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none;filter:drop-shadow(0 3px 4px #0004)}
button.dragging{cursor:grabbing}button.over img{filter:drop-shadow(0 0 6px #70df92)}button:disabled{cursor:wait;opacity:.75}
button:focus-visible{outline:2px solid #70df92;outline-offset:-5px;border-radius:20px}
</style></head><body>
<button id="rice" aria-label="白饭，拖到桌宠身上松手喂食，右击取消" title="拖到桌宠身上松手 · 右击取消"><img src="../../assets/pic/rice-bowl.png" alt="一碗白米饭" draggable="false"></button>
<script src="rice.js"></script></body></html>
